name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes="$RUNNER_TEMP/release-notes.md"

          # This version's section of the README changelog (everything under
          # "### <tag>" up to the next heading — the next release, or the
          # section after the changelog) becomes the release body; gh
          # prepends it to the auto-generated notes.
          awk -v head="### $tag" '
            $0 == head { found = 1; next }
            found && /^##+ / { exit }
            found { print }
          ' README.md > "$notes"

          args=(--title "$tag" --generate-notes --draft)
          if grep -q '[^[:space:]]' "$notes"; then
            args+=(--notes-file "$notes")
          else
            echo "::warning::No '### $tag' section in README.md — releasing with generated notes only."
          fi

          gh release create "$tag" "${args[@]}" main.js manifest.json styles.css
